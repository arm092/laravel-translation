name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: 10
            php: '8.1'
            testbench: '^8.0'
            phpunit: '^10.5.62'
            allow_upstream_advisories: true
          - laravel: 11
            php: '8.2'
            testbench: '^9.0'
            phpunit: '^11.5.50'
            allow_upstream_advisories: true
          - laravel: 12
            php: '8.2'
            testbench: '^10.0'
            phpunit: '^11.5.50'
            allow_upstream_advisories: false
          - laravel: 13-minimum
            php: '8.3'
            testbench: '^11.0'
            phpunit: '^12.5.8'
            prefer: '--prefer-lowest'
            allow_upstream_advisories: true
          - laravel: 13-latest
            php: '8.5'
            testbench: '^11.0'
            phpunit: '^13.0.3'
            allow_upstream_advisories: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Select matrix dependencies
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Allow resolution before the explicit audit
        run: composer config policy.advisories.block false

      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies ${{ matrix.prefer }}

      - name: Validate package metadata
        run: composer validate --strict --no-check-lock

      - name: Audit dependencies
        continue-on-error: ${{ matrix.allow_upstream_advisories }}
        run: bash scripts/composer-audit.sh

      - name: Check PHP syntax
        run: find src config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  livewire:
    name: Livewire 4 / Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: 10
            php: '8.1'
            testbench: '^8.0'
            phpunit: '^10.5.62'
            allow_upstream_advisories: true
          - laravel: 11
            php: '8.2'
            testbench: '^9.0'
            phpunit: '^11.5.50'
            allow_upstream_advisories: true
          - laravel: 12
            php: '8.2'
            testbench: '^10.0'
            phpunit: '^11.5.50'
            allow_upstream_advisories: false
          - laravel: 13-minimum
            php: '8.3'
            testbench: '^11.0'
            phpunit: '^12.5.8'
            prefer: '--prefer-lowest'
            allow_upstream_advisories: true
          - laravel: 13-latest
            php: '8.5'
            testbench: '^11.0'
            phpunit: '^13.0.3'
            allow_upstream_advisories: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Select matrix dependencies and Livewire 4
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" "livewire/livewire:^4.0"

      - name: Allow resolution before the explicit audit
        run: composer config policy.advisories.block false

      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies ${{ matrix.prefer }}

      - name: Validate package metadata
        run: composer validate --strict --no-check-lock

      - name: Audit dependencies
        continue-on-error: ${{ matrix.allow_upstream_advisories }}
        run: bash scripts/composer-audit.sh

      - name: Check PHP syntax
        run: find src config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run fallback-compatible PHPUnit suite
        run: vendor/bin/phpunit

      - name: Run Livewire PHPUnit suite
        run: vendor/bin/phpunit --configuration phpunit.livewire.xml

  livewire-3-fallback:
    name: Livewire 3 fallback / Laravel 12 / PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Select Laravel 12 and Livewire 3
        run: composer require --dev --no-update "orchestra/testbench:^10.0" "phpunit/phpunit:^11.5.50" "livewire/livewire:^3.0"

      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Validate package metadata
        run: composer validate --strict --no-check-lock

      - name: Audit dependencies
        run: bash scripts/composer-audit.sh

      - name: Check PHP syntax
        run: find src config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify the Alpine and Fetch fallback
        run: vendor/bin/phpunit

      - name: Verify Livewire 3 is detected as fallback
        run: vendor/bin/phpunit --configuration phpunit.livewire3.xml

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Run JavaScript tests
        run: npm test

      - name: Validate Apricode palette
        run: npm run check:palette

      - name: Build production assets
        run: npm run build

      - name: Verify committed assets
        run: |
          git diff --exit-code -- package-lock.json public/assets/css/main.css public/assets/js/app.js
          test -s public/assets/css/main.css
          grep -qi -- '--color-primary:#fd971f' public/assets/css/main.css

  static-analysis:
    name: Static analysis / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - laravel: 10
            php: '8.1'
            testbench: '^8.0'
            larastan: '^2.9'
            phpstan: '^1.12'
          - laravel: 13
            php: '8.5'
            testbench: '^11.0'
            larastan: '^3.0'
            phpstan: '^2.1'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}" "larastan/larastan:${{ matrix.larastan }}" "phpstan/phpstan:${{ matrix.phpstan }}"
      - run: composer config policy.advisories.block false
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test

  windows:
    name: Windows / Laravel 13 / PHP 8.5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite
          coverage: none
      - run: composer config policy.advisories.block false
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict --no-check-lock
      - run: vendor/bin/phpunit

  database-integration:
    name: Database / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: translation
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: translation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
      - run: composer config policy.advisories.block false
      - run: composer update --prefer-dist --no-interaction
      - name: Run database driver integration tests
        env:
          TRANSLATION_TEST_DB: ${{ matrix.database }}
        run: vendor/bin/phpunit tests/DatabaseDriverTest.php tests/ContractDatabaseLoaderTest.php
